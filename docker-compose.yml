      context: .
      dockerfile: services/logistics/Dockerfile
    container_name: logistics-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "8085:8080"
    networks:
      - pizza-network
