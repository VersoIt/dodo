  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway-service
    depends_on:
      - auth
      - catalog
      - orders
      - kitchen
      - logistics
    environment:
      - APP_PORT=8080
      - AUTH_SERVICE_ADDR=auth:8080
      - CATALOG_SERVICE_ADDR=catalog:8080
      - ORDERS_SERVICE_ADDR=orders:8080
      - KITCHEN_SERVICE_ADDR=kitchen:8080
      - LOGISTICS_SERVICE_ADDR=logistics:8080
      - ANALYTICS_SERVICE_ADDR=analytics:8080
    ports:
      - "8080:8080"
    networks:
      - pizza-network
    restart: always

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: pizza-frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"
    networks:
      - pizza-network
    restart: always

networks:
  pizza-network:
    driver: bridge
