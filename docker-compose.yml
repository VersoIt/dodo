services:
  postgres:
    image: postgres:16-alpine
    container_name: pizza-postgres
    environment:
      POSTGRES_USER: pizza_user
      POSTGRES_PASSWORD: pizza_password
      POSTGRES_DB: pizza_db
    ports:
      - "5432:5432"
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza_user -d pizza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: gomicro/goose:3.25.0
    container_name: migrations
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        for service in analytics auth catalog kitchen logistics notification orders treasury; do
          dir="services/$$service/migrations"
          if [ -d "$$dir" ]; then
            echo "Running migrations for $$service in $$dir..."
            goose -table "$${service}_db_version" -dir "$$dir" postgres "host=postgres user=pizza_user password=pizza_password dbname=pizza_db sslmode=disable" up
          else
            echo "No migrations found for $$service"
          fi
        done
    networks:
      - pizza-network

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    container_name: orders-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      LOG_LEVEL: debug
      CATALOG_SERVICE_ADDR: catalog:8080
      ANALYTICS_SERVICE_ADDR: analytics:8080
      KITCHEN_SERVICE_ADDR: kitchen:8080
      LOGISTICS_SERVICE_ADDR: logistics:8080
      TREASURY_SERVICE_ADDR: treasury:8080
      NOTIFICATION_SERVICE_ADDR: notification:8080
    ports:
      - "8081:8080"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "8082:8080"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: catalog-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "8083:8080"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  kitchen:
    build:
      context: .
      dockerfile: services/kitchen/Dockerfile
    container_name: kitchen-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "8084:8080"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M

  logistics:
