services:
  postgres:
    image: postgres:16-alpine
    container_name: pizza-postgres
    environment:
      POSTGRES_USER: pizza_user
      POSTGRES_PASSWORD: pizza_password
      POSTGRES_DB: pizza_db
    ports:
      - "5432:5432"
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza_user -d pizza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: pizza-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - pizza-network

  migrations:
    image: gomicro/goose:3.25.0
    container_name: migrations
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        for service in auth catalog chat kitchen logistics notification orders treasury; do
          dir="be/$$service/migrations"
          if [ -d "$$dir" ]; then
            echo "Running migrations for $$service in $$dir..."
            goose -table "$${service}_db_version" -dir "$$dir" postgres "host=postgres user=pizza_user password=pizza_password dbname=pizza_db sslmode=disable" up
          else
            echo "No migrations found for $$service"
          fi
        done
    networks:
      - pizza-network

  # Observability Stack
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter metrics
    networks:
      - pizza-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317"      # Otel gRPC
    networks:
      - pizza-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - pizza-network

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - pizza-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000"
    networks:
      - pizza-network

  # Microservices
  orders:
    build:
      context: .
      dockerfile: be/orders/Dockerfile
    container_name: orders-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      CATALOG_SERVICE_ADDR: catalog:9001
      KITCHEN_SERVICE_ADDR: kitchen:9003
      LOGISTICS_SERVICE_ADDR: logistics:9004
      TREASURY_SERVICE_ADDR: treasury:9006
      NOTIFICATION_SERVICE_ADDR: notification:9005
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: orders-service
    ports:
      - "9002:9002"
    networks:
      - pizza-network
    restart: always

  auth:
    build:
      context: .
      dockerfile: be/auth/Dockerfile
    container_name: auth-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: auth-service
      JWT_SECRET: super-secret-key
    ports:
      - "9900:9000"
    networks:
      - pizza-network
    restart: always

  catalog:
    build:
      context: .
      dockerfile: be/catalog/Dockerfile
    container_name: catalog-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: catalog-service
    ports:
      - "9001:9001"
    networks:
      - pizza-network
    restart: always

  kitchen:
    build:
      context: .
      dockerfile: be/kitchen/Dockerfile
    container_name: kitchen-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: kitchen-service
    ports:
      - "9003:9003"
    networks:
      - pizza-network
    restart: always

  logistics:
    build:
      context: .
      dockerfile: be/logistics/Dockerfile
    container_name: logistics-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: logistics-service
    ports:
      - "9004:9004"
    networks:
      - pizza-network
    restart: always

  notification:
    build:
      context: .
      dockerfile: be/notification/Dockerfile
    container_name: notification-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: notification-service
    ports:
      - "9005:9005"
    networks:
      - pizza-network
    restart: always

  treasury:
    build:
      context: .
      dockerfile: be/treasury/Dockerfile
    container_name: treasury-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: treasury-service
    ports:
      - "9006:9006"
    networks:
      - pizza-network
    restart: always

  chat:
    build:
      context: .
      dockerfile: be/chat/Dockerfile
    container_name: chat-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      nats:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      NATS_URL: nats://nats:4222
      GRPC_PORT: 9009
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: chat-service
    ports:
      - "9009:9009"
    networks:
      - pizza-network
    restart: always

  gateway:
    build:
      context: .
      dockerfile: be/gateway/Dockerfile
    container_name: gateway-service
    depends_on:
      - auth
      - catalog
      - orders
      - kitchen
      - logistics
      - chat
      - otel-collector
    environment:
      - APP_PORT=8080
      - AUTH_SERVICE_ADDR=auth:9000
      - CATALOG_SERVICE_ADDR=catalog:9001
      - ORDERS_SERVICE_ADDR=orders:9002
      - KITCHEN_SERVICE_ADDR=kitchen:9003
      - LOGISTICS_SERVICE_ADDR=logistics:9004
      - CHAT_SERVICE_ADDR=chat:9009
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=gateway-service
      - JWT_SECRET=super-secret-key
    ports:
      - "8080:8080"
    networks:
      - pizza-network
    restart: always

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: pizza-frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"
    networks:
      - pizza-network
    restart: always

networks:
  pizza-network:
    driver: bridge
