services:
  postgres:
    image: postgres:16-alpine
    container_name: pizza-postgres
    environment:
      POSTGRES_USER: pizza_user
      POSTGRES_PASSWORD: pizza_password
      POSTGRES_DB: pizza_db
    ports:
      - "5432:5432"
    networks:
      - pizza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza_user -d pizza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: pizza-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - pizza-network

  migrations:
    image: gomicro/goose:3.25.0
    container_name: migrations
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        for service in auth catalog chat kitchen logistics notification orders treasury; do
          dir="be/$$service/migrations"
          if [ -d "$$dir" ]; then
            echo "Running migrations for $$service in $$dir..."
            goose -table "$${service}_db_version" -dir "$$dir" postgres "host=postgres user=pizza_user password=pizza_password dbname=pizza_db sslmode=disable" up
          else
            echo "No migrations found for $$service"
          fi
        done
    networks:
      - pizza-network

  orders:
    build:
      context: .
      dockerfile: be/orders/Dockerfile
    container_name: orders-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      LOG_LEVEL: debug
      CATALOG_SERVICE_ADDR: catalog:9000
      KITCHEN_SERVICE_ADDR: kitchen:9000
      LOGISTICS_SERVICE_ADDR: logistics:9000
      TREASURY_SERVICE_ADDR: treasury:9000
      NOTIFICATION_SERVICE_ADDR: notification:9000
    ports:
      - "9002:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  auth:
    build:
      context: .
      dockerfile: be/auth/Dockerfile
    container_name: auth-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "9003:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  catalog:
    build:
      context: .
      dockerfile: be/catalog/Dockerfile
    container_name: catalog-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "9004:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  kitchen:
    build:
      context: .
      dockerfile: be/kitchen/Dockerfile
    container_name: kitchen-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "9005:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  logistics:
    build:
      context: .
      dockerfile: be/logistics/Dockerfile
    container_name: logistics-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "9006:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification:
    build:
      context: .
      dockerfile: be/notification/Dockerfile
    container_name: notification-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "9007:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  treasury:
    build:
      context: .
      dockerfile: be/treasury/Dockerfile
    container_name: treasury-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
      - "9008:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  chat:
    build:
      context: .
      dockerfile: be/chat/Dockerfile
    container_name: chat-service
    depends_on:
      migrations:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
      NATS_URL: nats://nats:4222
      APP_PORT: 9000
    ports:
      - "9009:9000"
    networks:
      - pizza-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  gateway:
    build:
      context: .
      dockerfile: be/gateway/Dockerfile
    container_name: gateway-service
    depends_on:
      - auth
      - catalog
      - orders
      - kitchen
      - logistics
      - chat
    environment:
      - APP_PORT=8080
      - AUTH_SERVICE_ADDR=auth:9000
      - CATALOG_SERVICE_ADDR=catalog:9000
      - ORDERS_SERVICE_ADDR=orders:9000
      - KITCHEN_SERVICE_ADDR=kitchen:9000
      - LOGISTICS_SERVICE_ADDR=logistics:9000
      - CHAT_SERVICE_ADDR=chat:9000
    ports:
      - "8080:8080"
    networks:
      - pizza-network
    restart: always

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: pizza-frontend
    depends_on:
      - gateway
    ports:
      - "3000:80"
    networks:
      - pizza-network
    restart: always

networks:
  pizza-network:
    driver: bridge
