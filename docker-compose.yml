  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: analytics-service
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://pizza_user:pizza_password@postgres:5432/pizza_db?sslmode=disable
    ports:
