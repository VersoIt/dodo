name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [
          "be/pkg",
          "be/auth",
          "be/catalog",
          "be/chat",
          "be/kitchen",
          "be/logistics",
          "be/notification",
          "be/orders",
          "be/treasury",
          "be/gateway"
        ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.path }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.work.sum
      - name: Start Services
        run: docker-compose up -d postgres nats
      - name: Wait for Services
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until docker-compose exec -T postgres pg_isready -U pizza_user -d pizza_db; do sleep 1; done
          echo "PostgreSQL is ready."
      - name: Run Migrations
        run: docker-compose up migrations
      - name: Run Tests
        run: |
          for D in be/*; do
            if [ -d "${D}" ]; then
              echo "--- Running tests in ${D} ---"
              (cd "${D}" && go test -v -race ./...)
            fi
          done

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [orders, auth, catalog, kitchen, logistics, notification, treasury, gateway, chat, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service == 'frontend' && 'fe/Dockerfile' || 'be/' + matrix.service + '/Dockerfile' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: versoit/pizza-${{ matrix.service }}:latest
