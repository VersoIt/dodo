name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [
          "pkg",
          "be/analytics",
          "be/auth",
          "be/catalog",
          "be/kitchen",
          "be/logistics",
          "be/notification",
          "be/orders",
          "be/treasury"
        ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.path }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Start Postgres
        run: docker compose up postgres -d
      - name: Wait for Postgres
        run: |
          until docker exec pizza-postgres pg_isready -U pizza_user; do
            sleep 1
          done
      - name: Run Migrations
        run: docker compose up migrations --exit-code-from migrations
      - name: Run Tests
        run: |
          go test -v ./pkg/...
          go test -v ./be/analytics/...
          go test -v ./be/auth/...
          go test -v ./be/catalog/...
          go test -v ./be/kitchen/...
          go test -v ./be/logistics/...
          go test -v ./be/notification/...
          go test -v ./be/orders/...
          go test -v ./be/treasury/...

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orders, auth, catalog, kitchen, logistics, analytics, notification, treasury]
    steps:
      - uses: actions/checkout@v4
      - name: Build Service
        run: |
          docker build -t pizza-${{ matrix.service }}:latest -f be/${{ matrix.service }}/Dockerfile .
