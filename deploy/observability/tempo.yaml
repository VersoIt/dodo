server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  max_block_duration: 5m               # cut the head block when it hits this size or ...
  max_block_bytes: 100_000_000         # ... when it hits this dynamic size
  trace_idle_period: 10s               # the head block will be moved to the WAL when it is idle for this long

compactor:
  compaction:
    compaction_window: 1h              # blocks in this time window will be compacted together
    max_block_bytes: 100_000_000       # maximum size of compacted blocks
    block_retention: 1h
    compacted_block_retention: 10m

storage:
  trace:
    backend: local                     # backend configuration to use
    wal:
      path: /tmp/tempo/wal             # where to store the the wal locally
    local:
      path: /tmp/tempo/blocks          # where to store the the blocks locally

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics] # enables service graphs and span metrics
