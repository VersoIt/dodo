syntax = "proto3";

package chat;

option go_package = "./pb;chat_pb";

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
}

message ClientMessage {
  oneof event {
    ConnectEvent connect = 1;
    SendMessageEvent send_message = 2;
    ReadMessageEvent read_message = 3;
  }
}

message ServerMessage {
  oneof event {
    MessageAck ack = 1;
    NewMessageEvent new_message = 2;
    ErrorEvent error = 3;
  }
}

message ConnectEvent {
  string user_id = 1;
  string role = 2;
  string order_id = 3;
  string sender_name = 4;
}

message SendMessageEvent {
  string request_id = 1;
  string text = 2;
}

message ReadMessageEvent {
  int64 message_id = 1;
}

message MessageAck {
  string request_id = 1;
  int64 message_id = 2;
}

message NewMessageEvent {
  int64 message_id = 1;
  string text = 2;
  string role = 3;
  string order_id = 4;
  google.protobuf.Timestamp created_at = 5;
  string sender_name = 6;
}

message ErrorEvent {
  string message = 1;
}

message GetHistoryRequest {
  string order_id = 1;
  int32 limit = 2;
}

message GetHistoryResponse {
  repeated Message messages = 1;
}

message Message {
  int64 id = 1;
  string order_id = 2;
  string sender_id = 3;
  string role = 4;
  string text = 5;
  bool is_read = 6;
  google.protobuf.Timestamp created_at = 7;
  string sender_name = 8;
}
